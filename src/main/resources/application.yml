spring:
  application:
    name: idempotent-ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_db
    username: ledger_user
    password: ledger_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html